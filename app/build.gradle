plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace 'com.paymentsave.paymentsave'
    compileSdk 34

    signingConfigs {
        release {
            keyAlias 'paymentpax'
            keyPassword 'paymentpax2020!'
            storeFile file('jks/PayPax.jks')
            storePassword 'paymentpax2020!'
        }
    }

    defaultConfig {
        applicationId "com.paymentsave.paymentsave"
        minSdk 23
        targetSdk 34
        versionCode 120
        versionName "1.2.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // OpenObserve (Panoptes) OTLP ingest. Token is loaded from
        // openobserve.properties (gitignored) — never commit the ingest secret.
        def openobserveToken = loadOpenObserveIngestToken()
        buildConfigField "String", "OPENOBSERVE_ENDPOINT", '"https://panoptes-prd.psapp.uk/api/default/v1/logs"'
        buildConfigField "String", "OPENOBSERVE_INGEST_EMAIL", '"terminal-ingest@paymentsave.com"'
        buildConfigField "String", "OPENOBSERVE_INGEST_TOKEN", "\"${escapeForBuildConfig(openobserveToken)}\""
        buildConfigField "String", "OPENOBSERVE_STREAM", '"terminal"'
        buildConfigField "String", "OPENOBSERVE_SERVICE_NAME", '"pax-terminal"'
        buildConfigField "String", "OPENOBSERVE_ENVIRONMENT", '"stg"'
        ndk {
            abiFilters 'armeabi'
        }
    }


    buildTypes {
        debug {
            signingConfig signingConfigs.debug
//            minifyEnabled true
//            shrinkResources false
            buildConfigField "String", "BASE_URL", '"https://stage.psapp.uk/"'
            buildConfigField "String", "BASE_IMAGE_URL", '"https://stage.psapp.uk/media/"'
            buildConfigField "String", "QR", '"https://merchant.psapp.uk/"'

//             buildConfigField "String", "BASE_URL", '"https://cloud.psapp.uk/"' //live server
//            buildConfigField "String", "BASE_IMAGE_URL", '"https://cloud.psapp.uk/media/"'
//            buildConfigField "String", "QR", '"https://merchant.psapp.uk/"'
//            proguardFiles getDefaultProguardFile('proguard-android.txt'),
//                    'proguard-rules.pro'
        }
        release {
            signingConfig signingConfigs.release
            buildConfigField "String", "BASE_URL", '"https://stage.psapp.uk/"'
            buildConfigField "String", "BASE_IMAGE_URL", '"https://stage.psapp.uk/media/"'
            buildConfigField "String", "QR", '"https://merchant.psapp.uk/"'

//            buildConfigField "String", "BASE_URL", '"https://cloud.psapp.uk/"'
//            buildConfigField "String", "BASE_IMAGE_URL", '"https://cloud.psapp.uk/media/"'
//            buildConfigField "String", "QR", '"https://merchant.psapp.uk/"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    android.applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "${variant.applicationId}_V${variant.versionCode}_VN-${variant.versionName}_" + new Date().format('yyyy-MM-dd') + ".apk"
        }
    }



    buildFeatures {
        buildConfig = true
    }
}

