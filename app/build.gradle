// OpenTelemetry's OTLP OkHttp sender pulls com.squareup.okhttp3:okhttp-android:5.x
// on Android. That AAR requires compileSdk 36. Rewrite it to OkHttp 4.12, which
// the exporter still supports and this project's AGP/SDK can compile.
configurations.configureEach {
    resolutionStrategy {
        force "com.squareup.okhttp3:okhttp:4.12.0"
        force "com.squareup.okhttp3:logging-interceptor:4.12.0"
        force "io.opentelemetry:opentelemetry-api:1.65.0"
        force "io.opentelemetry:opentelemetry-sdk:1.65.0"
        force "io.opentelemetry:opentelemetry-sdk-common:1.65.0"
        force "io.opentelemetry:opentelemetry-sdk-logs:1.65.0"
        force "io.opentelemetry:opentelemetry-sdk-metrics:1.65.0"
        force "io.opentelemetry:opentelemetry-sdk-trace:1.65.0"
        force "io.opentelemetry:opentelemetry-exporter-otlp:1.65.0"
        force "io.opentelemetry:opentelemetry-exporter-sender-okhttp:1.65.0"
        force "io.opentelemetry:opentelemetry-exporter-common:1.65.0"
        eachDependency { details ->
            if (details.requested.group == "com.squareup.okhttp3"
                    && (details.requested.name == "okhttp-android"
                    || details.requested.name == "okhttp-jvm")) {
                details.useTarget("com.squareup.okhttp3:okhttp:4.12.0")
                details.because("okhttp-android 5.x requires compileSdk 36")
            }
        }
    }
}

def loadOpenObserveIngestToken() {
    if (project.hasProperty("OPENOBSERVE_INGEST_TOKEN")) {
        return project.property("OPENOBSERVE_INGEST_TOKEN").toString()
    }

    def propertiesFile = rootProject.file("openobserve.properties")
    if (!propertiesFile.exists()) {
        return ""
    }

    def properties = new Properties()
    propertiesFile.withInputStream { stream ->
        properties.load(stream)
    }
    return properties.getProperty("OPENOBSERVE_INGEST_TOKEN", "")
}

def escapeForBuildConfig(String value) {
    if (value == null) {
        return ""
    }
    return value.replace("\\", "\\\\").replace("\"", "\\\"")
}